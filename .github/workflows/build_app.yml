name: Build OwnNet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Libbox AAR
        run: |
          chmod +x gradlew
          ./gradlew :libbox:assembleRelease || ./gradlew :libbox:bind || ./gradlew :app:downloadLibbox || true
          mkdir -p app/libs
          cp -r libbox/build/outputs/aar/* app/libs/ 2>/dev/null || true
          ls -la app/libs/

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwnNet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
