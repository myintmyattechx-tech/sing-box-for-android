name: Build OwnNet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Libbox (Go Core)
        run: |
          mkdir -p app/libs
          if [ -d "libbox" ]; then
            cd libbox
            gomobile bind -v -target=android -androidapi 21 -o ../app/libs/libbox.aar .
            cd ..
          else
            ./gradlew :app:downloadLibbox || true
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwnNet-APK
          path: app/build/outputs/apk/debug/app-debug.apk

